
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEase Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #172554, #4f46e5);
        }

        .login-container {
            width: 90%;
            max-width: 400px;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
        }

        .login-container h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 8px;
        }

        .login-container p {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
        }

        .login-container input {
            width: 100%;
            padding: 13px;
            margin-bottom: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        .login-container button {
            width: 100%;
            padding: 13px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-container button:hover {
            background: #3730a3;
        }

        .login-container button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #loginMessage {
            margin-top: 16px;
            font-size: 14px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .store-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #4f46e5;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>🛍️ ShopEase</h1>

        <p>Administrator Login</p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Admin Username"
                autocomplete="username"
                maxlength="100"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Admin Password"
                autocomplete="current-password"
                maxlength="128"
                required
            >

            <button type="submit" id="loginButton">
                Login
            </button>

        </form>

        <div id="loginMessage" role="status"></div>

        <a href="/" class="store-link">
            Back to ShopEase Store
        </a>

    </div>

    <script src="admin-login.js"></script>

</body>

</html>
