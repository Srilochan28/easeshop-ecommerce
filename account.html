
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEase - My Account</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #222;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        header h1 {
            margin: 0;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .account-container {
            width: 92%;
            max-width: 1000px;
            margin: 35px auto;
        }

        .account-card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }

        .account-card h2 {
            color: #172554;
            margin-top: 0;
        }

        .profile-detail {
            margin: 12px 0;
            color: #475569;
        }

        .orders-grid {
            display: grid;
            gap: 18px;
        }

        .order-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            padding: 20px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status {
            background: #fef3c7;
            color: #92400e;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        button {
            border: none;
            padding: 11px 16px;
            background: #2563eb;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: .85;
        }

        #logoutButton {
            background: #dc2626;
        }

        .order-details {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
        }

        #accountMessage {
            margin-bottom: 20px;
            color: #b91c1c;
        }

        .empty-message {
            color: #64748b;
        }

        @media (max-width: 550px) {
            .account-container {
                width: 94%;
            }

            .account-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🛍️ ShopEase</h1>

        <div>
            <a href="/">Visit Store</a>
            <button id="logoutButton">Logout</button>
        </div>
    </header>

    <main class="account-container">

        <div id="accountMessage" role="status"></div>

        <!-- Customer Profile -->
        <section class="account-card">

            <h2>My Profile</h2>

            <p class="profile-detail">
                <strong>Name:</strong>
                <span id="customerName">Loading...</span>
            </p>

            <p class="profile-detail">
                <strong>Email:</strong>
                <span id="customerEmail">Loading...</span>
            </p>

            <p class="profile-detail">
                <strong>Customer ID:</strong>
                <span id="customerId">Loading...</span>
            </p>

        </section>

        <!-- Customer Orders -->
        <section class="account-card">

            <h2>My Orders</h2>

            <p>View your previous purchases and order status.</p>

            <div id="customerOrders" class="orders-grid">
                <p class="empty-message">Loading your orders...</p>
            </div>

        </section>

    </main>

    <script src="account.js"></script>

</body>
</html>
