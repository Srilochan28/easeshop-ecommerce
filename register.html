
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEase - Customer Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #172554, #4f46e5);
        }

        .register-container {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #registerMessage {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .login-link,
        .store-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #4f46e5;
            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="register-container">

        <h1>🛍️ ShopEase</h1>

        <p class="subtitle">Create Your Customer Account</p>

        <form id="registerForm">

            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                maxlength="100"
                autocomplete="name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                maxlength="150"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Create a password (minimum 8 characters)"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="registerButton">
                Create Account
            </button>

        </form>

        <div id="registerMessage" role="status"></div>

        <a href="/customer-login.html" class="login-link">
            Already have an account? Login
        </a>

        <a href="/" class="store-link">
            Back to ShopEase Store
        </a>

    </div>

    <script src="register.js"></script>

</body>
</html>
